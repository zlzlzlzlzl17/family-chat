# Install inside nginx's http context (e.g. a sites-enabled include).
# Structure informed by a read-only Nginx 1.18 deployment inspection.
# Replace hosts, certificate paths and application paths before enabling.
map $http_upgrade $familychat_connection_upgrade {
    default upgrade;
    '' close;
}

# Deliberately omit query strings: /ws?token=... carries an access token.
log_format familychat_no_args '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name example.com manage.example.com;
    access_log /var/log/nginx/family-chat-access.log familychat_no_args;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com manage.example.com;

    # A certificate covering both names must already exist.
    ssl_certificate /path/to/app/tls/fullchain.pem;
    ssl_certificate_key /path/to/app/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:FamilyChatSSL:10m;

    # Enable only after your HTTPS certificate and redirect are working.
    # A single HSTS header is intentional; includeSubDomains is not assumed.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Applies to browser pages; it does not revoke native Android permissions.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/family-chat-access.log familychat_no_args;
    error_log /var/log/nginx/family-chat-error.log warn;

    # Retained APK management can accept up to 256 MiB plus multipart overhead.
    # Individual Node routes impose their own smaller limits.
    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite client-supplied forwarding headers at this single-proxy edge.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $familychat_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }
}
